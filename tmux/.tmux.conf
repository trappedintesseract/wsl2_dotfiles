# ==========================================================================
#  tmux.conf — Minimalista para desarrollo C/kernel + Neovim
# ==========================================================================
#  Instalar:
#    stow -t ~ tmux    (desde el repo de dotfiles)
#    o copiar a ~/.tmux.conf && tmux source ~/.tmux.conf
#
#  TPM se instala automáticamente con install.sh, o manualmente:
#    git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#    Luego en tmux: C-a I para instalar los plugins
# ==========================================================================

# ── Prefix ───────────────────────────────────────────────────────────────
# C-a es más cómodo que C-b (menos estiramiento)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Terminal & colores ───────────────────────────────────────────────────
# True color para que kanagawa (y cualquier tema) se vea bien
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",foot:RGB"
set -ag terminal-overrides ",ghostty:RGB"

# Undercurl support (para diagnósticos LSP subrayados)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Comportamiento general ───────────────────────────────────────────────
set -g escape-time 0              # Sin delay en Esc (crítico para nvim)
set -g history-limit 50000        # Scrollback largo (útil para logs de build)
set -g focus-events on            # Neovim detecta FocusGained/Lost
set -g mouse on                   # Ratón para resize, scroll, selección
set -g set-clipboard on           # OSC 52 clipboard passthrough
set -g base-index 1               # Ventanas empiezan en 1
set -g pane-base-index 1          # Panes empiezan en 1
set -g renumber-windows on        # Renumerar al cerrar ventanas
set -g display-time 2000          # Mensajes visibles 2s
set -g repeat-time 500

setw -g mode-keys vi              # Vi keys en copy-mode

# ── Splits & ventanas ───────────────────────────────────────────────────
# Splits intuitivos: | vertical, - horizontal (en el directorio actual)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Nueva ventana en directorio actual
bind c new-window -c "#{pane_current_path}"

# ── Navegación seamless Neovim ↔ tmux ────────────────────────────────────
# Detecta si el pane tiene nvim corriendo y reenvía C-hjkl
# Fuente: christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# También en copy-mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Limpiar pantalla (C-l está ocupado por navegación)
bind C-l send-keys 'C-l'

# ── Resize de panes ─────────────────────────────────────────────────────
# Alt + hjkl para resize (sin prefix)
bind -n M-h resize-pane -L 3
bind -n M-j resize-pane -D 3
bind -n M-k resize-pane -U 3
bind -n M-l resize-pane -R 3

# ── Copy mode (vi style) ────────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel

# ── Reload config ───────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Config recargada"

# ── tmux-sessionizer ─────────────────────────────────────────────────────
# C-f (sin prefix): abrir fuzzy finder de proyectos
bind-key -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
# prefix + f: lo mismo (por si C-f conflicta con algo)
bind-key f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
# prefix + s: switch entre sesiones activas (con preview)
bind-key s run-shell "tmux neww ~/.local/bin/tmux-sessionizer --switch"

# prefix + n: saltar a sesión de notas (o crearla)
bind-key n run-shell " \
  if tmux has-session -t=notes 2>/dev/null; then \
    tmux switch-client -t notes; \
  else \
    tmux new-session -ds notes -c $HOME/notes && \
    tmux switch-client -t notes; \
  fi"

# ── Layouts rápidos para kernel dev ──────────────────────────────────────
# prefix + K: layout kernel — editor arriba (grande), terminal abajo
bind K split-window -v -l 25% -c "#{pane_current_path}" \; \
       select-pane -t 1

# prefix + M: abrir un pane inferior con make
bind M split-window -v -l 30% -c "#{pane_current_path}" \; \
       send-keys "make -j\$(nproc) 2>&1 | head -50" \; \
       select-pane -t 1

# ── Status bar minimal ──────────────────────────────────────────────────
# Removed in favor of official Dracula theme

# ── Plugins (TPM) ───────────────────────────────────────────────────────
# tmux-resurrect: guarda y restaura sesiones (layout, panes, directorios)
# tmux-continuum: auto-save cada 15 minutos + auto-restore al arrancar
#
# Instalar TPM:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Luego en tmux: prefix + I (C-a I) para instalar los plugins
#
# Keybindings de resurrect (tras instalar):
#   prefix + C-s  → guardar sesión
#   prefix + C-r  → restaurar sesión

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @plugin 'dracula/tmux'

# Resurrect: guardar también los paneles de Neovim
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-save y auto-restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# TPM init (DEBE ser la última línea del fichero)
run '~/.tmux/plugins/tpm/tpm'

